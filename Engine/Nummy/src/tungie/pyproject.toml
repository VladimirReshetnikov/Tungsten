[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tungie"
version = "0.1.0"
description = "Dependency-light Tungsten-inspired calculator REPL for Nummy"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT-0" }
authors = [
  { name = "Nummy contributors" }
]
dependencies = []

[project.scripts]
tungie = "tungie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tungie*"]
