[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nummy"
version = "0.1.0"
description = "Asymptotic power-tower arithmetic for very large numbers, with leading-digit extraction."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vladimir Reshetnikov", email = "v.reshetnikov@gmail.com" }]
license = { text = "MIT" }
dependencies = ["mpmath>=1.3.0"]

[project.scripts]
nummy = "nummy.repl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nummy*"]
