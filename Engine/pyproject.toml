[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tungsten"
version = "0.1.0"
description = "Agent-oriented tooling for Wolfram Language, notebooks, documentation, and FrontEnd automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }
authors = [
  { name = "OpenAI Codex" }
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
